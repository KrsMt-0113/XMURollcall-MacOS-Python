name: Build XMURollcall

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Print Environment
      run: |
        sw_vers
        xcodebuild -version
        swift --version

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build (Release)
      run: make build

    - name: Build Tests (compile only)
      run: swift build --build-tests
      continue-on-error: true

    # Note: swift test requires a macOS 26+ runner to execute binaries
    # built with deployment target macOS 26. We compile-check tests above
    # but skip execution until GitHub provides macOS 26 runners.

    - name: Create DMG
      run: |
        mkdir -p dmg_staging
        cp -R .build/release/XMURollcall.app dmg_staging/
        hdiutil create -volname "XMU Rollcall" \
          -srcfolder dmg_staging \
          -ov -format UDZO \
          XMURollcall.dmg

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: XMURollcall-app
        path: XMURollcall.dmg
        retention-days: 30
