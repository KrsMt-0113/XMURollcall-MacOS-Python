name: Build XMURollcall

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build
      run: make build

    - name: Run Tests
      run: swift test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XMURollcall.app
        path: .build/XMURollcall.app
